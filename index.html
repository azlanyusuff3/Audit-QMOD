    @media(max-width:390px){.summary-grid,.overview-grid{grid-template-columns:1fr 1fr}.photo-tools{grid-template-columns:1fr}.record-actions{grid-template-columns:1fr}.status-buttons{grid-template-columns:1fr}.status{font-size:11px}.brand{font-size:16px}}
</style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><img src="icon-192.png" alt=""><span>Audit QMOD</span><span style="font-size:10px;font-weight:800;background:rgba(255,255,255,.16);padding:4px 7px;border-radius:999px">v5.5</span></div>
    <div class="top-spacer"></div>
    <button class="icon-btn" id="auditInfoBtn" style="display:none" onclick="openInfo()">Audit Info</button>
  </div></header>
  <main class="container" id="app"></main>

  <div class="modal" id="infoModal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">Audit record</div><h2>Audit Information</h2></div><button class="close" onclick="closeInfo()">✕</button></div><div class="form-grid" id="infoForm"></div><div class="modal-actions"><button class="btn outline" onclick="closeInfo()">Cancel</button><button class="btn primary" onclick="saveInfo()">Save Audit Info</button></div></div></div>

  <script src="audit-data.js?v=5.5"></script>
  <script src="app.js?v=5.5"></script>

  <script>
  // Audit QMOD v5.5: explicitly install the current worker so old PWA caches cannot keep the UI stuck.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('./sw.js?v=5.5', { scope: './', updateViaCache: 'none' });
        await reg.update();
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!sessionStorage.getItem('aqmod-sw-reloaded-v55')) {
            sessionStorage.setItem('aqmod-sw-reloaded-v55','1');
            location.reload();
          }
        });
      } catch (e) { console.warn('Audit QMOD service worker update failed', e); }
    });
  }
  </script>
